# Alembic configuration. Most options come from env vars via env.py.
[alembic]
# 迁移脚本目录 (由 env.py 在运行 alembic 时使用)
script_location = alembic

# 模板文件
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 在事务内逐迁移运行。生产推荐。
transactional_migrations = true

# 在日志中不区分大小写命名
truncate_slugs = true

# 时间戳格式
timezone = Asia/Shanghai

# 不在这里写 URL —— 由 env.py 从 settings 读取
sqlalchemy.url =

# 标签
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
